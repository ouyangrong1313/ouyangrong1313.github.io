name: 'Automatic build'
on:
  push:
    branches:
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  continuous-delivery:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0  # for posts's lastmod

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7
          bundler-cache: true

      - name: Check baseurl
        run: |
          baseurl="$(grep '^baseurl:' _config.yml | sed "s/.*: *//;s/['\"]//g;s/#.*//")"
          if [[ -n $baseurl ]]; then
            echo "BASE_URL=$baseurl" >> $GITHUB_ENV
          fi

      - name: Build Site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll b -d "_site$BASE_URL"
          touch "_site$BASE_URL/.nojekyll"

      - name: Test Site
        run: |
          bash tools/test.sh

      - name: Attach hotspot mirrors
        run: |
          # The hotspot sites are client-routed SPAs; their snapshots are built and committed
          # ahead of time, then copied in after the link check. htmlproofer only sees the Jekyll
          # output, and the snapshot reaches gh-pages through the normal deploy below.
          if [[ -n $BASE_URL ]]; then
            mv _site$BASE_URL _site-rename
            rm -rf _site
            mv _site-rename _site
          fi

          if [[ -d hotspot-src ]]; then
            cp -R hotspot-src/. _site/
            touch _site/.nojekyll
            echo "hotspot mirrors attached: $(find _site/reports/hotspot -name index.html | wc -l) pages"
          else
            echo "hotspot-src absent; skipping hotspot mirrors"
          fi

      - name: Deploy
        run: |
          bash tools/deploy.sh
